<!doctype html>
<html><head><meta charset="utf-8"><title>1337emoji</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><b>1337emoji</b> <span class="ver">2.0</span> <span id="host" class="host"></span></header>
<canvas id="preview" width="360" height="203"></canvas>
<section class="row"><div id="dirs" class="dirs"></div></section>
<section class="ctl">
  <label>Count <input id="count" type="range" min="1" max="300" step="1"><output id="count_v"></output></label>
  <label>Duration s <input id="dur" type="range" min="0.4" max="4" step="0.1"><output id="dur_v"></output></label>
  <label>Stagger % <input id="stagger" type="range" min="0" max="90" step="1"><output id="stagger_v"></output></label>
  <label>Size % <input id="size" type="range" min="2" max="60" step="1"><output id="size_v"></output></label>
  <label>Variance % <input id="sizeVar" type="range" min="0" max="90" step="1"><output id="sizeVar_v"></output></label>
  <label>Spin ° <input id="spin" type="range" min="0" max="720" step="5"><output id="spin_v"></output></label>
  <label>Wobble <input id="wobble" type="range" min="0" max="60" step="1"><output id="wobble_v"></output></label>
  <label>Motion blur <input id="blur" type="range" min="1" max="8" step="1"><output id="blur_v"></output></label>
  <label>Ease <select id="ease"><option value="1">Linear</option><option value="2">Ease In-Out</option><option value="3">Expo In-Out</option><option value="4">Expo Out</option></select></label>
  <label class="chk"><input id="pop" type="checkbox"> Pop-in</label>
  <label class="chk"><input id="peak" type="checkbox"> Peak on playhead (centre on the cut)</label>
  <button id="shuffle" class="small">🎲 New random layout</button>
</section>
<section class="pick">
  <div class="tray-head"><span id="selcount"></span><button id="clear" class="small">Clear</button></div>
  <div id="tray" class="tray"></div>
  <div class="filters"><select id="cat"></select><input id="q" placeholder="search emoji…"></div>
  <div id="grid" class="grid"></div>
</section>
<button id="go" class="go">RENDER + INSERT AT PLAYHEAD</button>
<div id="status" class="status">Renders once to a transparent ProRes clip: no lag on playback.</div>
<script src="CSInterface.js"></script><script src="data.js"></script><script src="main.js"></script>
</body></html>
