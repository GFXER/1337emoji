<!doctype html>
<html><head><meta charset="utf-8"><title>1337emoji</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<header>
  <div class="logo">1337<span>emoji</span></div>
  <div id="host" class="pill">…</div>
</header>

<main>
  <!-- preview -->
  <section class="glass card pv">
    <div class="pvwrap"><canvas id="preview" width="720" height="405"></canvas>
      <div class="pvbar">
        <button id="play" class="ic" title="Play / pause preview">❚❚</button>
        <button id="bgmode" class="ic" title="Preview background">◐</button>
        <button id="shuffle" class="ic" title="New random layout">⟳</button>
        <span id="seqinfo" class="seqinfo"></span>
      </div>
    </div>
  </section>

  <!-- emoji picker -->
  <section class="glass card">
    <div class="ch"><h2>Emoji</h2><span id="selcount" class="hint"></span><button id="clear" class="ghost">Clear</button></div>
    <div id="tray" class="tray"></div>
    <div class="search"><span>⌕</span><input id="q" placeholder="Search emoji"></div>
    <div id="cats" class="chips"></div>
    <div id="grid" class="grid"></div>
    <div class="hint small">Click = add / remove · Shift-click = more of it · Right-click a picked chip = one less</div>
  </section>

  <!-- motion -->
  <section class="glass card">
    <div class="ch"><h2>Direction</h2><span id="dirname" class="hint"></span></div>
    <div class="dirrow">
      <div id="compass" class="compass"></div>
      <div id="modes" class="modes"></div>
    </div>
  </section>

  <section class="glass card">
    <div class="ch"><h2>Motion</h2><button id="reset" class="ghost">Reset</button></div>
    <div id="sliders"></div>
    <div class="lbl">Ease</div>
    <div id="ease" class="seg"></div>
    <label class="tgl"><span>Pop-in</span><input id="pop" type="checkbox"><i></i></label>
    <label class="tgl"><span>Centre on playhead (peak on the cut)</span><input id="peak" type="checkbox"><i></i></label>
  </section>
</main>

<footer class="glass">
  <button id="go" class="go"><span class="fill" id="prog"></span><span id="golbl">Render + insert at playhead</span></button>
  <div id="status" class="status">Renders once to transparent ProRes 4444 · no playback lag</div>
</footer>

<script src="data.js"></script><script src="main.js"></script>
</body></html>
